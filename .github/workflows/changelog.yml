name: Changelog

# Fails a pull request that does not modify the changelog file.
# Generic: copy as is. Set CHANGELOG_FILE and SKIP_LABEL if yours differ.
# Dependabot pull requests are skipped: dependency bumps carry no entry.
on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

env:
  CHANGELOG_FILE: CHANGELOG.md
  SKIP_LABEL: skip-changelog

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Check the changelog was updated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Skipped: Dependabot pull request."
            exit 0
          fi
          if jq -e --arg l "$SKIP_LABEL" 'index($l) != null' <<< "$LABELS" > /dev/null; then
            echo "Skipped: '$SKIP_LABEL' label is set."
            exit 0
          fi
          if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -qxF "$CHANGELOG_FILE"; then
            echo "$CHANGELOG_FILE is updated."
          else
            echo "::error::Add an entry to $CHANGELOG_FILE, or apply the '$SKIP_LABEL' label."
            exit 1
          fi
