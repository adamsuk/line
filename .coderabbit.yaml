# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Owned by this repo (was factory-managed). Scott 9 Nov 2026: free-tier CodeRabbit
# only auto-reviews size/L and size/XL; smaller PRs use thorough independent review.
language: en-GB
inheritance: true
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: false
    drafts: false
    labels:
      - size/L
      - size/XL
  path_instructions:
    - path: "**"
      instructions: >-
        Treat the PR title and description as claims to check against the diff, not as facts.
        Flag any change to tests, CI config (.github/workflows, .github/actions, .github/factory.yml),
        lockfiles or agent instructions (AGENTS.md, agents/, CODEOWNERS), since those need a person's review.
